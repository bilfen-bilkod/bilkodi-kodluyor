<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#647bfb">
<meta name="description" content="Bilkodi ile Minik Adımlar: 3-4 yaş için 15 kısa kodlama görevi ve 6 eğlenceli puzzle.">
<title>Bilkodi ile Minik Adımlar | Bilfen Anaokulları</title>
<style>
:root{
  --ink:#25345a;--sub:#707d9c;--violet:#746cff;--blue:#4b94fa;
  --pink:#ff74a6;--mint:#3ccbb1;--sun:#ffcf63;--paper:#fff;
  --shadow:0 12px 34px rgba(84,91,156,.11);--rad:27px;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:linear-gradient(130deg,#e9f5ff 0%,#f9eaff 49%,#fff5dd 100%);color:var(--ink);font-family:"Trebuchet MS","Arial Rounded MT Bold",ui-rounded,system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:4px solid #334dc1;outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.58}
#app{height:100%;max-width:1460px;margin:auto;display:flex;flex-direction:column;padding:clamp(8px,1.2vw,19px);gap:clamp(7px,1vw,13px);position:relative;isolation:isolate}
#app:before,#app:after{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(4px)}
#app:before{width:380px;height:380px;background:#bde5ff6b;left:-210px;top:6%}
#app:after{width:380px;height:380px;background:#ffd9e66d;right:-180px;bottom:-100px}
.site-header{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;min-height:62px;padding:0 7px;gap:12px}
.brand{display:flex;align-items:center;min-width:0;gap:14px}
.brand-logo{display:block;width:clamp(118px,12.8vw,160px);height:60px;object-fit:contain;mix-blend-mode:multiply}
.brand-title{display:flex;flex-direction:column;gap:1px;white-space:nowrap}
.brand-title strong{font-size:clamp(15px,1.65vw,21px);letter-spacing:-.3px}
.brand-title span{font-size:11px;color:#777da7;font-weight:800;letter-spacing:1.5px}
.header-actions{display:flex;gap:9px;align-items:center}
.icon-btn{width:46px;height:46px;display:grid;place-items:center;line-height:1;border:2px solid #ffffffea;background:#ffffffc7;color:#4b6088;border-radius:16px;box-shadow:0 4px 12px #8b93c21c;font-size:23px;transition:.15s transform}
.icon-btn:active{transform:scale(.94)}
.icon-btn.home-only{display:none}
#screen-root{min-height:0;flex:1}
.screen{height:100%;min-height:0;position:relative}
.card{background:rgba(255,255,255,.89);border:2px solid rgba(255,255,255,.91);border-radius:var(--rad);box-shadow:var(--shadow)}
/* Home */
.home-layout{display:grid;grid-template-columns:1.06fr .94fr;gap:clamp(12px,2vw,27px);height:100%;min-height:0}
.home-copy{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:clamp(22px,4vw,62px);overflow:hidden;background:linear-gradient(152deg,#ffffffee,#fffdfbf5)}
.home-copy:before{content:"";width:220px;height:220px;border-radius:50%;background:#fff0bc99;position:absolute;right:-105px;top:-120px}
.pill{display:inline-flex;gap:7px;align-items:center;border-radius:999px;padding:9px 15px;background:#e8efff;font-size:clamp(11px,1vw,14px);font-weight:1000;letter-spacing:.5px;color:#506bd3;white-space:nowrap}
.home-copy h1{font-size:clamp(38px,4.4vw,70px);line-height:1.065;margin:clamp(14px,2.5vh,25px) 0 12px;letter-spacing:-2.2px;color:#2b3e7b;font-weight:1000}
.home-copy h1 em{font-style:normal;color:#ef65a0}
.home-copy .greeting{font-size:clamp(23px,2.3vw,35px);line-height:1.16;font-weight:1000;color:#5c66e5;margin:0 0 10px}
.home-copy p{font-size:clamp(15px,1.38vw,20px);line-height:1.5;color:var(--sub);max-width:460px;margin:0 0 22px;font-weight:700}
.primary-btn{border:none;color:white;background:linear-gradient(115deg,#ff75aa,#f15891);box-shadow:0 9px 0 #cf4380,0 19px 27px #ff80af44;border-radius:21px;padding:17px 26px;font-size:clamp(19px,1.7vw,25px);font-weight:1000;letter-spacing:.5px;display:inline-flex;align-items:center;justify-content:center;gap:12px;transition:transform .12s,box-shadow .12s;text-align:center}
.primary-btn:active{transform:translateY(6px);box-shadow:0 3px 0 #cf4380,0 7px 15px #ff80af44}
.primary-btn .triangle{font-size:1.13em}
.home-stat-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(22px,4vh,42px)}
.home-stat{border-radius:15px;background:#f5f7ff;border:1px solid #e8eeff;padding:10px 15px;font-weight:1000;color:#5b6388;font-size:13px}
.home-stat b{color:#5b6dde;font-size:18px;margin-right:4px}
.home-art{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 46%,#fbfeff 0,#d9e9ff 58%,#cfe0ff 100%)}
.hero-orbit{position:absolute;width:min(80%,480px);aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,#ffef9d,#ffe7c5 50%,#ffd6d9);box-shadow:0 25px 60px #a0b6e53b;top:48%;left:50%;transform:translate(-50%,-50%)}
.hero-orbit:after{content:"";position:absolute;inset:16px;border:4px dashed #ffffff88;border-radius:50%}
.hero-bot{position:relative;z-index:2;object-fit:contain;max-width:90%;max-height:82%;filter:drop-shadow(0 20px 16px #47639930);animation:float 4s ease-in-out infinite}
.float-emoji{position:absolute;z-index:3;font-size:clamp(28px,3vw,46px);filter:drop-shadow(0 6px 5px #748dc13a);animation:float 3s ease-in-out infinite}
.float-a{left:9%;top:14%;transform:rotate(-20deg);animation-delay:.4s}.float-b{right:9%;top:20%;animation-delay:1.3s}.float-c{left:14%;bottom:14%;animation-delay:1s}.float-d{right:12%;bottom:14%;animation-delay:.2s}
.hero-note{position:absolute;right:7%;bottom:7%;z-index:4;padding:11px 16px;border-radius:17px;background:#ffffffee;color:#5362a3;box-shadow:0 7px 18px #384b8430;font-weight:1000;font-size:15px;transform:rotate(-5deg)}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
/* Common stage header */
.stage-shell{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.stage-header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:10px 18px;min-height:69px;background:#ffffffdd}
.stage-info{display:flex;align-items:center;gap:10px;flex:none}
.stage-icon{font-size:28px;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#e7f0ff}
.stage-name{font-size:clamp(13px,1.45vw,20px);font-weight:1000;line-height:1.2}
.stage-kicker{font-size:10px;font-weight:1000;letter-spacing:1.3px;color:#7b88a9}
.progress-wrapper{flex:1;min-width:90px;max-width:570px}
.progress-label{text-align:right;font-size:12px;color:#8793ad;font-weight:1000;margin-bottom:6px}
.progress-bars{display:flex;gap:4px}
.progress-bar{flex:1;height:10px;min-width:3px;background:#edf1fd;border-radius:20px;transition:background .3s}
.progress-bar.done{background:#50cfb8}.progress-bar.current{background:#ff8db5;box-shadow:0 0 0 2px #ffe4ee}
.game-columns,.puzzle-columns{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);gap:12px;flex:1;min-height:0}
.board-card{height:100%;display:flex;flex-direction:column;align-items:stretch;overflow:hidden;padding:clamp(10px,1.6vw,20px);gap:3px;background:linear-gradient(150deg,#f6fcff 2%,#e8f5ff 100%)}
.mission-row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex:0 0 auto}
.mission-title{font-size:clamp(17px,1.8vw,25px);font-weight:1000;line-height:1.2;margin:0;color:#30457c}
.mission-caption{font-size:clamp(11px,.9vw,14px);font-weight:800;color:#7792ac;margin-top:5px}
.speak-btn{width:49px;height:49px;flex:none;border:0;background:#d8e6ff;border-radius:16px;font-size:24px;box-shadow:inset 0 -3px 0 #bad2f5}
.board-holder{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;padding:1px 4px}
.grid-board{position:relative;height:min(100%,48dvh,430px);width:auto;max-width:100%;max-height:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:8px;padding:8px;border-radius:23px;background:#9dc8ff70;border:3px solid #fff;box-shadow:inset 0 0 0 2px #aad4ff,0 15px 22px #81a9d42f;overflow:hidden}
.board-cell{border-radius:15px;background:#ffffffbd;box-shadow:inset 0 -6px 0 #d9ebff9c;display:flex;align-items:center;justify-content:center;position:relative;min-width:0;min-height:0}
.board-cell.goal-cell{background:#fff3c9;box-shadow:inset 0 -6px 0 #f7db89,0 0 0 2px #ffdf7c}
.goal-content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;width:100%;height:100%}
.goal-emoji{font-size:clamp(32px,3.9vw,58px);line-height:1.1;filter:drop-shadow(0 5px 2px #7b84952b);animation:goalpop 2.5s ease-in-out infinite}
.goal-label{background:#ffffffdd;font-weight:1000;font-size:clamp(9px,.85vw,13px);padding:2px 6px;border-radius:8px;color:#64749a;text-transform:uppercase;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes goalpop{0%,100%{transform:scale(1)}50%{transform:scale(1.10)}}
.start-cell{outline:2px dashed #79b4f8;outline-offset:-6px}
.hint-mark{position:absolute;z-index:2;top:4px;right:4px;width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:#ff88b5;color:white;font-size:15px;font-weight:1000;box-shadow:0 2px 0 #d1548b}
.avatar{position:absolute;top:8px;left:8px;width:calc((100% - 16px - 16px)/3);height:calc((100% - 16px - 16px)/3);z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;transform:translate(calc(var(--x) * (100% + 8px)),calc(var(--y) * (100% + 8px)));transition:transform 430ms cubic-bezier(.21,.79,.36,1.11)}
.avatar:before{content:"";position:absolute;width:70%;height:65%;background:#fefcffe6;border-radius:50%;box-shadow:0 5px 12px #6c79ad38;left:15%;top:18%}
.avatar img{width:98%;height:98%;object-fit:contain;position:relative;filter:drop-shadow(0 7px 5px #5e6a973b)}
.board-under{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:27px;color:#6483a6;font-size:clamp(10px,1vw,13px);font-weight:900}
.tiny-btn{font-size:12px;font-weight:1000;border:2px solid #cee1ff;background:#ffffffc9;border-radius:12px;padding:7px 10px;color:#566ab2;line-height:1.1}
/* Controls */
.controls-card{padding:clamp(12px,1.8vw,23px);display:flex;flex-direction:column;justify-content:space-between;gap:9px;overflow:hidden;height:100%;background:linear-gradient(165deg,#fffffffa,#fffafaef)}
.control-heading{text-align:center;flex:0 0 auto}
.control-heading h3{margin:0;color:#3a447e;font-size:clamp(17px,1.55vw,21px);font-weight:1000}
.control-heading p{margin:2px 0 0;color:#8b94ad;font-weight:800;font-size:12px}
.arrow-panel{display:flex;flex-direction:column;align-items:center;gap:5px}
.section-tag{font-size:11px;font-weight:1000;letter-spacing:.6px;color:#7381a3}
.arrow-pad{display:grid;grid-template-areas:". up ." "left down right";grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:9px;width:min(100%,260px);margin:3px auto}
.arrow-btn{border:0;border-radius:17px;display:grid;place-items:center;color:white;font-size:clamp(29px,3vw,40px);font-weight:1000;line-height:1;min-width:0;min-height:65px;box-shadow:0 6px 0 var(--down-color);transition:transform .12s,box-shadow .12s}
.arrow-btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--down-color)}
.arrow-up{grid-area:up;background:#35c89b;--down-color:#1b9977}.arrow-left{grid-area:left;background:#ffbf53;--down-color:#dc9139}.arrow-down{grid-area:down;background:#f6829f;--down-color:#d25578}.arrow-right{grid-area:right;background:#6397ff;--down-color:#4570d8}
.code-panel{display:flex;flex-direction:column;gap:6px}
.code-head{display:flex;justify-content:space-between;align-items:center;gap:7px}
.code-head button{background:none;border:none;color:#7a88b1;font-size:12px;font-weight:1000;padding:3px 4px;text-decoration:underline}
.code-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.code-slot{height:clamp(53px,6.2vh,72px);background:#f0f3ff;outline:2px dashed #d6ddf5;outline-offset:-5px;border:0;border-radius:15px;display:grid;place-items:center;color:#a2afcd;font-size:27px;font-weight:1000;min-width:0;position:relative}
.code-slot.filled{background:var(--slot-color);outline:0;color:white;box-shadow:inset 0 -5px 0 #00000016}
.code-slot small{position:absolute;top:3px;left:8px;font-size:10px;font-weight:1000;opacity:.8}
.run-panel{display:flex;flex-direction:column;gap:5px}
.run-btn{height:clamp(60px,7.5vh,77px);border:0;border-radius:19px;color:#fff;background:linear-gradient(112deg,#35cbb1,#18b99e);box-shadow:0 7px 0 #11957c,0 10px 19px #28ceba37;font-size:clamp(19px,1.9vw,26px);font-weight:1000;line-height:1;letter-spacing:.2px}
.run-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #11957c}
.run-btn:disabled{transform:none;box-shadow:0 5px 0 #87aead}
.feedback{background:#f5f2ff;border-radius:12px;min-height:33px;padding:8px 12px;display:flex;justify-content:center;align-items:center;font-size:clamp(11px,1.1vw,14px);font-weight:1000;color:#6b70af;text-align:center;line-height:1.2}
.feedback.warning{color:#b76b48;background:#fff2e3}.feedback.good{color:#198772;background:#e0fbf4}
/* Puzzle */
.puzzle-columns{grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr)}
.puzzle-board-card{background:linear-gradient(155deg,#f9f3ff,#e7f4ff);align-items:center}
.puzzle-name{font-size:clamp(20px,2vw,27px);font-weight:1000;text-align:center;margin:2px 0 0;color:#364982}
.puzzle-instruction{font-size:clamp(11px,1.1vw,14px);font-weight:900;color:#8b92b4;margin:0;text-align:center}
.puzzle-board-wrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}
.puzzle-board{height:min(100%,46dvh,430px);width:auto;max-width:100%;max-height:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:6px;background:#fff;box-shadow:0 14px 24px #a2b0dd53,0 0 0 5px #fff;border:5px solid #e9e8ff;border-radius:17px;overflow:hidden}
.puzzle-slot{border:2px dashed #c8c8ed;position:relative;border-radius:8px;background:#fcfcff;overflow:hidden;cursor:pointer;touch-action:manipulation}
.puzzle-slot:focus-visible{outline:4px solid #d45fe9;outline-offset:-4px}
.puzzle-slot .slice{width:100%;height:100%;background-repeat:no-repeat;background-size:200% 200%;position:absolute;inset:0}
.puzzle-slot .guide{opacity:.15;filter:saturate(.55)}
.puzzle-slot .placed{opacity:1;animation:appearPiece .2s ease-out}
.puzzle-slot.highlight{box-shadow:inset 0 0 0 4px #ffd66d}
.puzzle-slot.wrong{animation:shake .35s linear}
@keyframes appearPiece{from{transform:scale(.83);opacity:.4}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{translate:0}25%{translate:-6px}75%{translate:6px}}
.puzzle-progress{width:min(100%,430px);display:flex;justify-content:center;align-items:center;gap:7px;margin:4px 0}
.puzzle-check{font-size:19px;background:#eeeaff;border-radius:50%;width:31px;height:31px;display:grid;place-items:center;color:#adb5d8}
.puzzle-check.done{background:#d7faf1;color:#22a98d}
.puzzle-tray-card{height:100%;padding:clamp(12px,2vw,26px);display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:8px;overflow:hidden}
.puzzle-tray-card h3{font-size:clamp(17px,1.8vw,24px);margin:0;color:#3c4d87;text-align:center;font-weight:1000}
.puzzle-tray-card p{font-size:clamp(12px,1.3vw,16px);text-align:center;color:#8791af;font-weight:900;margin:0}
.puzzle-tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(10px,1.9vw,20px);width:min(100%,clamp(220px,26vw,332px));aspect-ratio:1;align-self:center}
.puzzle-piece{touch-action:none;background:#fff;border:5px solid white;border-radius:17px;box-shadow:0 6px 0 #d5d4eb,0 9px 17px #7b7ea235;cursor:grab;position:relative;min-height:0;min-width:0;padding:0;overflow:hidden;transition:transform .12s}
.puzzle-piece:active{cursor:grabbing}
.puzzle-piece.selected{outline:5px solid #ffba5b;transform:scale(1.05);z-index:2;box-shadow:0 5px 0 #eb8b39,0 12px 23px #d48f4960}
.puzzle-piece.used{visibility:hidden;pointer-events:none}
.puzzle-piece .piece-art{width:100%;height:100%;background-repeat:no-repeat;background-size:200% 200%}
.puzzle-piece .piece-number{position:absolute;right:6px;bottom:6px;background:#fffdfbe8;display:grid;place-items:center;border-radius:50%;font-size:13px;font-weight:1000;color:#5975a8;width:24px;height:24px}
.puzzle-hint{padding:10px 13px;border-radius:13px;background:#fff4d8;color:#9a7540;font-weight:1000;font-size:clamp(11px,1vw,14px);text-align:center}
.drag-ghost{position:fixed;z-index:10001;pointer-events:none;border:5px solid white;border-radius:14px;box-shadow:0 17px 28px #2d316e66;opacity:.91;overflow:hidden}
.drag-ghost .piece-art{width:100%;height:100%;background-repeat:no-repeat;background-size:200% 200%}
/* Transition + final screens */
.celebration-screen{height:100%;display:flex;align-items:center;justify-content:center;gap:clamp(20px,4vw,52px);padding:25px;position:relative;background:linear-gradient(145deg,#fffbff,#ecf7ff);overflow:hidden}
.celebration-bot{width:min(40%,400px);max-height:80%;object-fit:contain;filter:drop-shadow(0 18px 14px #6f7baa43);animation:float 3s ease-in-out infinite}
.celebration-text{max-width:550px;display:flex;flex-direction:column;align-items:flex-start;gap:13px;z-index:1}
.celebration-text h2{font-size:clamp(32px,4.3vw,61px);line-height:1.1;color:#34468a;margin:0;font-weight:1000;letter-spacing:-1.4px}
.celebration-text p{color:#7b86a9;font-size:clamp(17px,1.65vw,23px);font-weight:900;margin:0 0 13px;line-height:1.45}
.celebration-stars{font-size:clamp(28px,3.5vw,51px);letter-spacing:4px;filter:drop-shadow(0 7px 3px #8e83a634)}
/* Success modal */
#modal-root{position:fixed;inset:0;z-index:600;pointer-events:none}
#modal-root:not(:empty){pointer-events:auto}
.modal-overlay{position:absolute;inset:0;background:#2b3d7c8c;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px)}
.success-dialog{position:relative;z-index:2;background:#fff;border:5px solid white;border-radius:33px;box-shadow:0 24px 80px #1b2c6d53;max-width:min(94vw,520px);width:100%;text-align:center;padding:28px 25px 31px;display:flex;flex-direction:column;align-items:center;gap:11px;animation:popIn .3s cubic-bezier(.2,1.3,.3,1)}
@keyframes popIn{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}
.success-dialog h2{font-weight:1000;font-size:clamp(27px,3.3vw,44px);margin:0;color:#4053a2}
.success-dialog p{font-size:clamp(15px,1.45vw,19px);color:#7d87a8;font-weight:900;margin:0 0 11px}
.success-dialog .reward-stars{font-size:60px;line-height:1.15;letter-spacing:8px;animation:goalpop 1.5s infinite}
.modal-btn{width:100%;max-width:350px;white-space:normal}
.confetti{position:absolute;z-index:1;top:-10vh;width:12px;height:25px;border-radius:4px;animation:confettiFall var(--dur) linear infinite;left:var(--left);background:var(--col);transform:rotate(var(--rot));opacity:.9}
@keyframes confettiFall{to{top:108vh;transform:translateX(120px) rotate(720deg)}}
/* Adaptive sizes */
@media(max-height:800px) and (min-width:801px){
 .site-header{min-height:54px}.brand-logo{height:52px}
 .stage-header{min-height:60px;padding:7px 15px}.stage-icon{height:42px;width:42px;font-size:25px}
 .grid-board{height:min(100%,45dvh,430px)}.puzzle-board{height:min(100%,44dvh,430px)}
 .controls-card{gap:6px}.arrow-pad{width:min(100%,225px);gap:7px}.arrow-btn{min-height:55px}
 .code-slot{height:54px}.run-btn{height:58px}.feedback{min-height:29px}
 .home-copy{padding:clamp(24px,3vw,45px)}
}
@media(max-width:900px) and (orientation:portrait){
 #app{padding:7px;gap:7px}
 .site-header{min-height:51px}.brand-logo{width:111px;height:48px}.brand-title strong{font-size:14px}.brand-title span{font-size:9px}
 .header-actions{gap:5px}.icon-btn{width:39px;height:39px;border-radius:12px;font-size:19px}
 .stage-shell{gap:7px}.stage-header{padding:6px 11px;min-height:55px}.stage-icon{width:36px;height:36px;font-size:21px;border-radius:12px}.stage-name{font-size:15px}.stage-kicker{font-size:9px}.progress-label{font-size:10px;margin-bottom:3px}.progress-bar{height:8px;gap:2px}
 .home-layout{grid-template-columns:1fr;grid-template-rows:1.03fr .97fr;gap:9px}
 .home-copy{padding:clamp(16px,4vw,32px);justify-content:center;align-items:center;text-align:center}.home-copy h1{font-size:clamp(30px,6.6vw,54px);margin:7px 0}.home-copy .greeting{font-size:clamp(20px,4vw,30px);margin:0 0 5px}.home-copy p{font-size:14px;line-height:1.3;margin:0 0 12px}.home-stat-row{margin-top:13px;justify-content:center}.home-stat{font-size:11px;padding:6px 9px}.home-stat b{font-size:13px}
 .primary-btn{padding:12px 22px;font-size:18px;border-radius:14px;box-shadow:0 6px 0 #cf4380,0 9px 14px #ff80af44}
 .hero-bot{max-height:94%;max-width:62%}.hero-orbit{width:min(50%,230px)}.hero-note{font-size:11px;bottom:5%}.float-emoji{font-size:30px}
 .game-columns,.puzzle-columns{grid-template-columns:1fr;grid-template-rows:minmax(0,1.03fr) minmax(0,.97fr);gap:7px}
 .board-card{padding:8px;gap:2px}.mission-title{font-size:clamp(17px,3vw,22px)}.mission-caption{font-size:11px;margin-top:1px}.mission-row{padding:0 5px}.speak-btn{width:36px;height:36px;border-radius:11px;font-size:18px}
 .grid-board{height:min(100%,31dvh,310px);gap:5px;padding:6px;border-radius:16px}.avatar{top:6px;left:6px;width:calc((100% - 12px - 10px)/3);height:calc((100% - 12px - 10px)/3);transform:translate(calc(var(--x) * (100% + 5px)),calc(var(--y) * (100% + 5px)))}.board-cell{border-radius:11px}.goal-emoji{font-size:clamp(30px,5vw,51px)}.goal-label{font-size:10px}.board-under{min-height:23px}
 .controls-card{padding:9px;display:grid;grid-template-areas:"head head" "arrows code" "arrows run" "feedback feedback";grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px}
 .control-heading{grid-area:head}.control-heading h3{font-size:15px}.control-heading p{display:none}
 .arrow-panel{grid-area:arrows;align-self:stretch;justify-content:center}.arrow-pad{gap:5px;width:min(100%,210px)}.arrow-btn{min-height:48px;font-size:26px;border-radius:12px;box-shadow:0 4px 0 var(--down-color)}
 .code-panel{grid-area:code;justify-content:center}.code-head{flex-wrap:wrap}.section-tag{font-size:9px}.code-head button{font-size:10px}.code-slots{gap:4px}.code-slot{height:clamp(38px,5vh,58px);border-radius:9px;font-size:22px}
 .run-panel{grid-area:run;align-self:end}.run-btn{height:48px;font-size:17px;border-radius:12px;box-shadow:0 4px 0 #11957c}
 .feedback{grid-area:feedback;font-size:11px;padding:5px;min-height:26px}
 .puzzle-board{height:min(100%,29dvh,310px);gap:4px}.puzzle-board-card{padding:7px}.puzzle-name{font-size:19px}.puzzle-instruction{font-size:11px}.puzzle-progress{margin:2px}.puzzle-check{width:21px;height:21px;font-size:13px}
 .puzzle-tray-card{padding:8px;display:grid;grid-template-areas:"title title" "tray hint";grid-template-columns:1fr minmax(120px,.8fr);grid-template-rows:auto 1fr;gap:6px;align-items:center}
 .puzzle-tray-card h3{grid-area:title;font-size:15px}.puzzle-tray-card p{display:none}.puzzle-tray{grid-area:tray;width:min(100%,26dvh,210px);justify-self:center;gap:8px}.puzzle-piece{border-width:3px;border-radius:11px}.puzzle-hint{grid-area:hint;font-size:12px;padding:10px}
 .celebration-screen{flex-direction:column;gap:5px;text-align:center;padding:17px}.celebration-bot{width:auto;max-height:43%;max-width:58%}.celebration-text{align-items:center;gap:8px}.celebration-text h2{font-size:clamp(30px,6.3vw,48px)}.celebration-text p{font-size:15px}
}
@media(max-width:530px) and (orientation:portrait){
 .brand-title{display:none}.stage-name{font-size:12px}.stage-kicker{font-size:9px}.progress-wrapper{min-width:70px}.progress-bar{gap:2px}.progress-bars{gap:2px}
 .home-layout{grid-template-rows:1.04fr .96fr}.home-copy h1{font-size:clamp(30px,9vw,46px)}.home-copy p{font-size:13px}.hero-bot{max-width:81%;max-height:95%}.hero-orbit{width:65%}
 .game-columns{grid-template-rows:minmax(0,1.06fr) minmax(0,.94fr)}.grid-board{height:min(100%,30dvh,260px)}
 .arrow-pad{width:min(100%,175px)}.arrow-btn{min-height:46px;font-size:24px}
 .puzzle-tray{width:min(100%,24dvh,185px)}.puzzle-hint{font-size:10px}
 .board-under{font-size:10px}.tiny-btn{font-size:10px;padding:5px 7px}
}
@media(max-height:650px) and (orientation:landscape){
 #app{padding:6px;gap:5px}.site-header{min-height:45px}.brand-logo{height:43px;width:113px}.brand-title strong{font-size:16px}.brand-title span{font-size:9px}.icon-btn{width:38px;height:38px;font-size:19px;border-radius:12px}
 .stage-shell{gap:5px}.stage-header{min-height:45px;padding:4px 12px}.stage-icon{width:35px;height:35px;font-size:22px}.stage-name{font-size:15px}.stage-kicker{font-size:8px}.progress-label{margin-bottom:2px;font-size:10px}.progress-bar{height:7px}
 .grid-board{height:min(100%,42dvh,380px);gap:5px;padding:5px}.puzzle-board{height:min(100%,40dvh,380px)}
 .board-card{padding:8px}.mission-title{font-size:17px}.mission-caption{font-size:10px}.speak-btn{width:32px;height:32px;font-size:17px}.board-under{min-height:21px}.tiny-btn{padding:5px 9px}
 .controls-card{padding:8px;gap:4px}.control-heading h3{font-size:16px}.control-heading p{display:none}.arrow-pad{width:min(100%,190px);gap:5px}.arrow-btn{min-height:42px;border-radius:12px;font-size:26px;box-shadow:0 4px 0 var(--down-color)}
 .code-slot{height:43px}.run-btn{height:47px;font-size:18px}.feedback{min-height:24px;font-size:11px;padding:4px}.code-head button{font-size:11px}
 .home-copy h1{font-size:clamp(30px,4vw,49px)}.home-copy .greeting{font-size:22px}.home-copy p{font-size:14px;margin-bottom:13px}.home-stat-row{margin-top:12px}.primary-btn{padding:12px 16px;font-size:19px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

const state={screen:'home',level:0,position:[0,1],program:[],running:false,hint:false,failed:0,sound:true,

const wait=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
let audioCtx=null;
function playNotes(notes=[540]){
 if(!state.sound)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();
  const t=audioCtx.currentTime;
  notes.forEach((freq,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type='sine';osc.frequency.value=freq;
    gain.gain.setValueAtTime(.0001,t+i*.13);gain.gain.exponentialRampToValueAtTime(.055,t+i*.13+.018);
    gain.gain.exponentialRampToValueAtTime(.0001,t+i*.13+.18);
    osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t+i*.13);osc.stop(t+i*.13+.2);
  });
 }catch(err){/* browser may not support audio */}
}
function speak(text){
 if(!state.sound||!('speechSynthesis'in window))return;
 try{window.speechSynthesis.cancel();const s=new SpeechSynthesisUtterance(text);s.lang='tr-TR';s.rate=.83;s.pitch=1.18;
   window.speechSynthesis.speak(s)}catch(err){}
}
function stopSpeech(){if('speechSynthesis'in window)try{window.speechSynthesis.cancel()}catch(err){}}

}

function makeHome(){return `<section class="screen home-layout"><div class="home-copy card"><span class="pill">✨ 3–4 YAŞ · EĞLENCELİ KODLAMA</span><h1>BİLKODİ İLE<br><em>MİNİK ADIMLAR</em></h1><div class="greeting">Haydi başlayalım!</div><p>Bilkodi'ye oklarla yol göster. Minik hedeflere ulaş, sonra rengârenk puzzle'ları tamamla!</p><button id="start-button" class="primary-btn"><span class="triangle">▶</span> BAŞLA!</button><div class="home-stat-row"><span class="home-stat"><b>15</b> KODLAMA GÖREVİ</span><span class="home-stat"><b>6</b> PUZZLE</span><span class="home-stat"><b>1–3</b> ADIM</span></div></div><div class="home-art card"><div class="hero-orbit"></div><span class="float-emoji float-a">⭐</span><span class="float-emoji float-b">🎈</span><span class="float-emoji float-c">🧩</span><span class="float-emoji float-d">💙</span><img class="hero-bot" alt="Gülümseyen Bilkodi robot karakteri" src="${BILKODI_SRC}"><div class="hero-note">BİLKODİ SENİ BEKLİYOR! ✨</div></div></section>`}

 for(let y=0;y<3;y++)for(let x=0;x<3;x++){

function makeCoding(){const l=LEVELS[state.level];return `<section class="screen stage-shell">${progressHeader('coding',state.level,LEVELS.length,'🧠')}<div class="game-columns"><div class="board-card card"><div class="mission-row"><div><h2 class="mission-title">${l.goal} ${l.mission}</h2><div class="mission-caption">Bilkodi'yi hedefe götürelim!</div></div><button class="speak-btn" id="speak-button" aria-label="Hedefi sesli dinle" title="Hedefi dinle">🔊</button></div><div class="board-holder"><div class="grid-board" id="game-board" aria-label="3'e 3 kodlama oyun alanı">${gameBoardCells(l)}<div class="avatar" id="avatar" style="--x:${state.position[0]};--y:${state.position[1]}"><img src="${BILKODI_SRC}" alt="Bilkodi"></div></div></div><div class="board-under"><span>👣 Hedefe ${l.path.length} minik adım!</span><button class="tiny-btn" id="hint-button">${state.hint?'✨ İpucunu gizle':'✨ İpucu göster'}</button></div></div><div class="controls-card card" id="control-panel"><div class="control-heading"><h3>👆 Oklara dokun, yol yap!</h3><p>Önce okları seç, sonra Bilkodi'yi yürüt.</p></div><div class="arrow-panel"><span class="section-tag">1 · OKLARI SEÇ</span><div class="arrow-pad"><button class="arrow-btn arrow-up" data-move="up" aria-label="Yukarı" title="Yukarı">↑</button><button class="arrow-btn arrow-left" data-move="left" aria-label="Sola" title="Sola">←</button><button class="arrow-btn arrow-down" data-move="down" aria-label="Aşağı" title="Aşağı">↓</button><button class="arrow-btn arrow-right" data-move="right" aria-label="Sağa" title="Sağa">→</button></div></div><div class="code-panel"><div class="code-head"><span class="section-tag">2 · BENİM KOMUTLARIM</span><button id="undo-button" title="Son oku sil">↶ Geri al</button></div><div class="code-slots" id="code-slots"></div></div><div class="run-panel"><button class="run-btn" id="run-button">▶ HAREKET ET!</button></div><div class="feedback" id="feedback" role="status">En fazla 3 ok seçebilirsin! 🌟</div></div></div></section>`}
function renderProgram(){const list=document.getElementById('code-slots');if(!list)return;
 list.innerHTML=Array.from({length:3},(_,i)=>{const k=state.program[i];return `<div class="code-slot ${k?'filled':''}" ${k?`style="--slot-color:${ARROWS[k].color}"`:''}><small>${i+1}</small>${k?ARROWS[k].symbol:'+'}</div>`}).join('');
 const cannotAdd=state.program.length>=3||state.running;

function addMove(d){if(state.screen!=='coding'||state.running||state.program.length>=3)return;state.program.push(d);playNotes([d==='up'?660:d==='down'?440:d==='left'?494:587]);renderProgram();feedback(`${state.program.length} ok seçtin. ${state.program.length===3?'Şimdi hareket edelim!':'Devam edebilirsin!'} 🌟`)}
function undoMove(){if(state.running||!state.program.length)return;state.program.pop();playNotes([392]);renderProgram();feedback('Bir oku geri aldın. ↶')}
async function runMoves(){
 if(state.screen!=='coding'||state.running||!state.program.length)return;
 const token=++state.runToken;state.running=true;renderProgram();feedback('Bilkodi yürüyor... 👣','good');
 const l=LEVELS[state.level];let outside=false;
 for(let i=0;i<state.program.length;i++){
  const dir=ARROWS[state.program[i]];const nx=state.position[0]+dir.dx,ny=state.position[1]+dir.dy;
  if(nx<0||nx>2||ny<0||ny>2){outside=true;playNotes([280]);break}
  state.position=[nx,ny];const avatar=document.getElementById('avatar');if(avatar){avatar.style.setProperty('--x',nx);avatar.style.setProperty('--y',ny)}
  playNotes([510+i*80]);await wait(540);if(token!==state.runToken||state.screen!=='coding')return;
 }
 await wait(180);if(token!==state.runToken||state.screen!=='coding')return;
 if(!outside&&state.position[0]===l.end[0]&&state.position[1]===l.end[1]){
  state.running=false;playNotes([523,659,784,1046]);showWinModal('coding');return;
 }
 state.failed++;
 feedback(outside?'Bilkodi oyun alanından çıkmasın! Tekrar deneyelim. 💛':'Az kaldı! Başka oklarla yeniden deneyelim. 💛','warning');
 await wait(550);if(token!==state.runToken||state.screen!=='coding')return;
 state.position=[...l.start];const avatar=document.getElementById('avatar');if(avatar){avatar.style.setProperty('--x',state.position[0]);avatar.style.setProperty('--y',state.position[1])}
 state.program=[];state.running=false;renderProgram();if(state.failed>=2&&!state.hint)feedback('İstersen “İpucu göster”e dokunabilirsin. ✨','warning');
}
function confettiHTML(){const colors=['#fa79a6','#5ab7ff','#fbc766','#4ad2a5','#ae91fa'];return Array.from({length:36},(_,i)=>`<i class="confetti" style="--left:${(i*37)%100}%;--col:${colors[i%5]};--rot:${i*29}deg;--dur:${2.9+(i%8)*.18}s;animation-delay:-${(i%9)*.3}s"></i>`).join('')}
function showWinModal(mode){const isCode=mode==='coding',last=isCode?state.level===LEVELS.length-1:state.puzzle===PUZZLES.length-1;
 const title=last?(isCode?'Kodlama tamamlandı!':'Müthiş başardın!'):(isCode?'Harika Bilkodi!':'Puzzle tamam!');
 const desc=last?(isCode?'15 minik hedefe ulaştın. Şimdi puzzle zamanı! 🧩':'6 puzzle’ı da bitirdin. Aferin sana! 🌟'):(isCode?'Bilkodi hedefine ulaştı!':'Bütün parçaları birleştirdin!');
 const action=last?(isCode?'🧩 PUZZLE’A GEÇ':'🏆 KUTLAMAYA GEÇ'):(isCode?'⭐ SONRAKİ GÖREV':'🧩 SONRAKİ PUZZLE');
 modalRoot.innerHTML=`<div class="modal-overlay">${confettiHTML()}<div class="success-dialog" role="dialog" aria-modal="true" aria-labelledby="success-title"><div class="reward-stars">🌟 ⭐ 🌟</div><h2 id="success-title">${title}</h2><p>${desc}</p><button id="next-button" class="primary-btn modal-btn">${action} ▶</button></div></div>`;
 document.getElementById('next-button').addEventListener('click',()=>{playNotes([659,784]);modalRoot.innerHTML='';if(isCode){if(last)startPuzzleIntro();else{state.level++;resetLevel();setScreen('coding')}}else{if(last)setScreen('finish');else{state.puzzle++;resetPuzzle();setScreen('puzzle')}}});
 document.getElementById('next-button').focus({preventScroll:true});
}
function slicePosition(i){return `${(i%2)*100}% ${Math.floor(i/2)*100}%`}
function makePuzzle(){const p=PUZZLES[state.puzzle];return `<section class="screen stage-shell">${progressHeader('puzzle',state.puzzle,PUZZLES.length,'🧩')}<div class="puzzle-columns"><div class="board-card puzzle-board-card card"><h2 class="puzzle-name">${p.emoji} ${p.name}</h2><p class="puzzle-instruction">Parçaları doğru yerlere koy!</p><div class="puzzle-board-wrap"><div class="puzzle-board" id="puzzle-board" aria-label="Dört bölmeli puzzle alanı">${Array.from({length:4},(_,i)=>`<div class="puzzle-slot" data-slot="${i}" role="button" tabindex="0" aria-label="${i+1}. puzzle yeri"><div class="slice guide"></div><div class="slice placed" style="display:none"></div></div>`).join('')}</div></div><div class="puzzle-progress" id="puzzle-progress">${Array.from({length:4},()=>'<span class="puzzle-check">☆</span>').join('')}</div></div><div class="puzzle-tray-card card"><h3>🌟 Parçaları birleştirelim!</h3><p>Önce parçaya, sonra boş yerine dokun.</p><div class="puzzle-tray" id="puzzle-tray">${state.order.map(i=>`<button type="button" class="puzzle-piece" data-piece="${i}" aria-label="${i+1}. parçayı seç"><div class="piece-art"></div><span class="piece-number">${i+1}</span></button>`).join('')}</div><div class="puzzle-hint" id="puzzle-feedback">👆 Parçaya dokun → doğru yere dokun!<br>İstersen parçayı sürükleyebilirsin.</div></div></div></section>`}
function paintPuzzle(){const p=PUZZLES[state.puzzle];if(!p)return;
 document.querySelectorAll('.puzzle-slot').forEach(slot=>{const i=Number(slot.dataset.slot),pos=slicePosition(i);
  const g=slot.querySelector('.guide'),placed=slot.querySelector('.placed');g.style.backgroundImage=`url("${p.url}")`;g.style.backgroundPosition=pos;
  placed.style.backgroundImage=`url("${p.url}")`;placed.style.backgroundPosition=pos;
  placed.style.display=state.placed.has(i)?'block':'none';g.style.display=state.placed.has(i)?'none':'block';
  slot.setAttribute('aria-label',`${i+1}. puzzle yeri, ${state.placed.has(i)?'dolu':'boş'}`);
 });
 document.querySelectorAll('.puzzle-piece').forEach(piece=>{const i=Number(piece.dataset.piece);piece.querySelector('.piece-art').style.backgroundImage=`url("${p.url}")`;
  piece.querySelector('.piece-art').style.backgroundPosition=slicePosition(i);
  piece.classList.toggle('selected',state.selected===i);piece.classList.toggle('used',state.placed.has(i));
  piece.setAttribute('aria-pressed',String(state.selected===i));
 });

}
function selectPuzzlePiece(i){if(state.screen!=='puzzle'||state.placed.has(i))return;state.selected=i;playNotes([600]);paintPuzzle();const f=document.getElementById('puzzle-feedback');if(f)f.textContent='✨ Şimdi bu parçanın resimdeki yerine dokun!'}
function placePuzzlePiece(slotIndex,requestedPiece=state.selected){if(state.screen!=='puzzle'||state.placed.has(slotIndex))return;
 if(requestedPiece===null||requestedPiece===undefined){const f=document.getElementById('puzzle-feedback');if(f)f.textContent='👆 Önce bir puzzle parçasına dokun!';return}

 state.placed.add(slotIndex);state.selected=null;playNotes([650,780]);paintPuzzle();
 const f=document.getElementById('puzzle-feedback');if(f)f.textContent=`🌟 Bravo! ${state.placed.size} / 4 parça tamam!`;
 if(state.placed.size===4){setTimeout(()=>{if(state.screen==='puzzle') {playNotes([523,659,784,1046]);showWinModal('puzzle')}},460)}
}
let pointer=null;
function initPuzzlePointer(){document.querySelectorAll('.puzzle-piece').forEach(piece=>{
 piece.addEventListener('pointerdown',e=>{
   if(e.button!==0||state.placed.has(+piece.dataset.piece))return;
   e.preventDefault();pointer={id:e.pointerId,piece:+piece.dataset.piece,originX:e.clientX,originY:e.clientY,moving:false,ghost:null};
   piece.setPointerCapture?.(e.pointerId);
 });
 piece.addEventListener('click',e=>{if(e.detail===0)selectPuzzlePiece(+piece.dataset.piece)});
 });
 document.querySelectorAll('.puzzle-slot').forEach(slot=>{
  slot.addEventListener('click',()=>placePuzzlePiece(+slot.dataset.slot));
  slot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();placePuzzlePiece(+slot.dataset.slot)}});
 });
}
document.addEventListener('pointermove',e=>{
 if(!pointer||e.pointerId!==pointer.id||state.screen!=='puzzle')return;
 const dist=Math.hypot(e.clientX-pointer.originX,e.clientY-pointer.originY);
 if(dist>13&&!pointer.moving){pointer.moving=true;
  const p=document.querySelector(`.puzzle-piece[data-piece="${pointer.piece}"]`);
  if(p){pointer.ghost=p.cloneNode(true);pointer.ghost.classList.add('drag-ghost');pointer.ghost.classList.remove('selected');pointer.ghost.style.width='105px';pointer.ghost.style.height='105px';pointer.ghost.style.margin='0';document.body.appendChild(pointer.ghost)}
 }
 if(pointer.moving&&pointer.ghost){pointer.ghost.style.left=(e.clientX-52)+'px';pointer.ghost.style.top=(e.clientY-52)+'px'}
},{passive:true});
document.addEventListener('pointerup',e=>{
 if(!pointer||e.pointerId!==pointer.id)return;
 const snapshot=pointer;pointer=null;
 if(snapshot.ghost)snapshot.ghost.remove();
 if(state.screen!=='puzzle')return;
 if(snapshot.moving){const element=document.elementFromPoint(e.clientX,e.clientY);const slot=element?.closest('.puzzle-slot');if(slot)placePuzzlePiece(+slot.dataset.slot,snapshot.piece);else selectPuzzlePiece(snapshot.piece)}
 else selectPuzzlePiece(snapshot.piece);
});
document.addEventListener('pointercancel',()=>{if(pointer?.ghost)pointer.ghost.remove();pointer=null});

   document.querySelectorAll('[data-move]').forEach(btn=>btn.addEventListener('click',()=>addMove(btn.dataset.move)));
   document.getElementById('run-button').addEventListener('click',runMoves);
   document.getElementById('undo-button').addEventListener('click',undoMove);
   document.getElementById('speak-button').addEventListener('click',()=>speak(LEVELS[state.level].mission));
   document.getElementById('hint-button').addEventListener('click',()=>{state.hint=!state.hint;const l=LEVELS[state.level];
     const board=document.getElementById('game-board');board.innerHTML=gameBoardCells(l)+`<div class="avatar" id="avatar" style="--x:${state.position[0]};--y:${state.position[1]}"><img src="${BILKODI_SRC}" alt="Bilkodi"></div>`;
     document.getElementById('hint-button').textContent=state.hint?'✨ İpucunu gizle':'✨ İpucu göster';playNotes([670,790]);
   });
   renderProgram();
 }
 if(state.screen==='puzzle'){paintPuzzle();initPuzzlePointer()}
 if(state.screen==='puzzle-intro')document.getElementById('puzzle-start-button').addEventListener('click',startPuzzle);
 if(state.screen==='finish'){document.getElementById('restart-button').addEventListener('click',startGame);playNotes([523,659,784,1046])}
}
document.getElementById('home-button').addEventListener('click',showHome);
document.getElementById('sound-button').addEventListener('click',e=>{state.sound=!state.sound;e.currentTarget.textContent=state.sound?'🔊':'🔇';e.currentTarget.setAttribute('aria-label',state.sound?'Sesi kapat':'Sesi aç');if(!state.sound)stopSpeech();else playNotes([700])});
document.getElementById('fullscreen-button').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(err){/* Full screen permission depends on browser */}});
document.addEventListener('keydown',e=>{
 if(!modalRoot.innerHTML&&state.screen==='coding'&&!state.running){
  const keys={'ArrowUp':'up','ArrowDown':'down','ArrowLeft':'left','ArrowRight':'right'};
  if(keys[e.key]){e.preventDefault();addMove(keys[e.key])}
  else if(e.key==='Enter'){e.preventDefault();runMoves()}
  else if(e.key==='Backspace'){e.preventDefault();undoMove()}
 }
});
// Verify every task is reachable by 1–3 moves and every prescribed path ends on its target.
LEVELS.forEach((l,i)=>{let [x,y]=l.start;l.path.forEach(k=>{x+=ARROWS[k].dx;y+=ARROWS[k].dy});if(l.path.length<1||l.path.length>3||x!==l.end[0]||y!==l.end[1])throw Error('Invalid coding level '+(i+1))});
render();
</script>
</body>
</html>
